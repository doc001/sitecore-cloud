<!--
  Open Studies courses-by-school accordion.
  Paste this whole block into a Webflow Embed widget.
  Data source: https://bvc-thesis.vercel.app/data/open-studies-by-area.json
  Rebuild the data with: npm run generateOpenStudiesByArea  (then deploy:bvcapp)

  Behaviour:
   • One accordion drawer per school/area.
   • Expand all / Collapse all controls.
   • Courses with availability link to their Open Studies page; courses without
     availability show "No availability this term" instead of a link.
-->
<style>
  .bvc-os-accordion {
    font-family: inherit;
  }

  .bvc-os-accordion .os-controls {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .bvc-os-accordion .os-controls button {
    background: #031a62;
    color: #fff;
    border: none;
    border-radius: 4px;
    padding: 0.5rem 1rem;
    font-size: 0.9em;
    cursor: pointer;
  }

  .bvc-os-accordion .os-controls button:hover {
    background: #0032a0;
  }

  .bvc-os-accordion .accordion-item {
    margin-bottom: 10px;
  }

  .bvc-os-accordion .accordion-button {
    width: 100%;
    height: 40px;
    padding-left: 1em;
    text-align: left;
    font-size: 1em;
    background-image: linear-gradient(101deg, rgba(3, 26, 98, 0.4), rgba(255, 255, 255, 0.2));
    background-color: rgb(0, 163, 255);
    color: white;
    border: none;
    cursor: pointer;
    position: relative;
  }

  .bvc-os-accordion .accordion-button::after {
    content: ">";
    position: absolute;
    right: 1rem;
    font-size: 1.4em;
    transition: transform 0.3s ease;
    transform: rotate(90deg);
  }

  .bvc-os-accordion .accordion-button.active::after {
    transform: rotate(-90deg);
  }

  .bvc-os-accordion .accordion-content {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.4s ease;
    background: #f1f1f1;
    padding: 0 1em;
  }

  .bvc-os-accordion .accordion-content.open {
    padding: 1em;
  }

  .bvc-os-accordion table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem auto;
  }

  .bvc-os-accordion th,
  .bvc-os-accordion td {
    padding: 0.75rem;
    text-align: left;
    border: 1px solid #ccc;
  }

  .bvc-os-accordion th {
    background-color: #0077cc;
    color: white;
  }

  .bvc-os-accordion .table-center {
    text-align: center;
  }

  .bvc-os-accordion tr:nth-child(even) {
    background-color: #f9f9f9;
  }

  .bvc-os-accordion .no-availability {
    color: #888;
    font-style: italic;
    font-size: 0.85em;
  }

  .bvc-os-accordion .os-error {
    color: #b00020;
    padding: 1rem;
    border: 1px solid #b00020;
    border-radius: 4px;
  }

  .bvc-os-accordion .pdf {
    font-family: "Material Icons", sans-serif;
  }
</style>

<div class="bvc-accordion bvc-os-accordion" data-bvc-open-studies>
  <div class="os-controls">
    <button type="button" data-os-expand>Expand all</button>
    <button type="button" data-os-collapse>Collapse all</button>
  </div>
  <div data-os-list>Loading courses…</div>
</div>

<script>
  (function () {
    var DATA_URL = "https://bvc-thesis.vercel.app/data/open-studies-by-area.json";
    var PAGE_BASE = "https://www.bowvalleycollege.ca"; // Open Studies pages live here
    var root = document.querySelector("[data-bvc-open-studies]");
    if (!root) return;
    var list = root.querySelector("[data-os-list]");

    function el(tag, props, children) {
      var node = document.createElement(tag);
      if (props) Object.keys(props).forEach(function (k) {
        if (k === "class") node.className = props[k];
        else if (k === "text") node.textContent = props[k];
        else node.setAttribute(k, props[k]);
      });
      (children || []).forEach(function (c) { if (c) node.appendChild(c); });
      return node;
    }

    function courseRow(course) {
      var tr = el("tr");

      // Code cell — link only when the course has availability.
      var codeTd = el("td");
      if (course.available && course.pageUrl) {
        codeTd.appendChild(el("a", { href: PAGE_BASE + course.pageUrl, text: course.code }));
      } else {
        codeTd.appendChild(el("span", { text: course.code }));
      }
      tr.appendChild(codeTd);

      // Course name (+ no-availability note when applicable).
      var nameTd = el("td", { text: course.name });
      if (!course.available) {
        nameTd.appendChild(document.createElement("br"));
        nameTd.appendChild(el("span", { class: "no-availability", text: "No availability this term" }));
      }
      tr.appendChild(nameTd);

      // Credits.
      tr.appendChild(el("td", { class: "table-center", text: course.credits || "" }));

      // PDF outline.
      var pdfTd = el("td", { class: "table-center" });
      if (course.pdf) {
        var link = el("a", { href: course.pdf, target: "_blank", rel: "noopener" });
        link.appendChild(el("span", { class: "pdf", text: "picture_as_pdf" }));
        pdfTd.appendChild(link);
      }
      tr.appendChild(pdfTd);

      return tr;
    }

    function areaBlock(area) {
      var btn = el("button", { class: "accordion-button", type: "button", "aria-expanded": "false", text: area.name });

      var thead = el("thead", null, [
        el("tr", null, [
          el("th", { text: "Code" }),
          el("th", { text: "Course" }),
          el("th", { class: "table-center", text: "Credits" }),
          el("th", { class: "table-center", text: "PDF" })
        ])
      ]);
      var tbody = el("tbody", null, area.courses.map(courseRow));
      var content = el("div", { class: "accordion-content" }, [el("table", null, [thead, tbody])]);

      btn.addEventListener("click", function () {
        var expanded = btn.getAttribute("aria-expanded") === "true";
        setOpen(btn, content, !expanded);
      });

      return el("div", { class: "accordion-item" }, [btn, content]);
    }

    function setOpen(btn, content, open) {
      btn.setAttribute("aria-expanded", String(open));
      btn.classList.toggle("active", open);
      content.classList.toggle("open", open);
      content.style.maxHeight = open ? content.scrollHeight + "px" : null;
    }

    function bindControls() {
      root.querySelector("[data-os-expand]").addEventListener("click", function () {
        root.querySelectorAll(".accordion-item").forEach(function (item) {
          setOpen(item.querySelector(".accordion-button"), item.querySelector(".accordion-content"), true);
        });
      });
      root.querySelector("[data-os-collapse]").addEventListener("click", function () {
        root.querySelectorAll(".accordion-item").forEach(function (item) {
          setOpen(item.querySelector(".accordion-button"), item.querySelector(".accordion-content"), false);
        });
      });
    }

    fetch(DATA_URL)
      .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function (data) {
        var areas = (data && data.areas) || [];
        if (!areas.length) throw new Error("No areas in data");
        list.innerHTML = "";
        areas.forEach(function (area) { list.appendChild(areaBlock(area)); });
        bindControls();
      })
      .catch(function (err) {
        console.error("[bvc-open-studies]", err);
        list.innerHTML = "";
        list.appendChild(el("div", { class: "os-error", text: "Unable to load course list. Please try again later." }));
      });
  })();
</script>
