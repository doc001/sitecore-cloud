<!--
  ── THEN DELETE THE OLD EMBED ──────────────────────────────────────────
  Clear the `courses-code` CMS field on all 56 programs that currently hold a
  copy of the old inline script. Leaving it in place means two accordions race
  for the same mount, and the old one guesses the program from the slug.

  ── WHICH PROGRAM IS SHOWN ─────────────────────────────────────────────
  No configuration is required: the script mounts on the existing #Courses
  rich-text slot and looks the program up by URL slug in
  /data/static/program-requirements-index.json. All 62 published programs
  resolve today.

  Recommended anyway — make it explicit and slug-proof. On the #Courses div in
  the Designer, add a custom attribute:

      name   data-program-code
      value  (click the purple "+" and bind the Code field)

  This is the fix for the reported bug: the certificate page
  /programs/early-childhood-education-and-development (code ECE) was being
  served the ECED *diploma* dataset — 69 credits instead of 36 — because the
  old script appended '-diploma' to the slug before '-certificate' and took the
  first hit. Program codes are unique, so a bound code cannot collide.

  Two other ways to supply the code, if the attribute is awkward to bind:
      <meta name="bvc-program-code" content="ECE">
      <script>window.__PROGRAM_REQUIREMENTS_CONFIG__ = { code: 'ECE' };</script>
  The config object must be declared BEFORE the script tag above.

  ── ORIGINS ────────────────────────────────────────────────────────────
  The JSON origin defaults to wherever program-requirements.js was served from,
  so these two tags keep working unchanged when the site itself moves onto
  Vercel and serves /js/*, /css/* and /data/* from a single origin — the URLs
  become same-origin and nothing needs editing. Override only if you need to
  point at a different deployment:

      <script>window.__PROGRAM_REQUIREMENTS_CONFIG__ = { dataOrigin: 'https://bvc-app-uat.vercel.app' };</script>

  ── OPEN STUDIES ───────────────────────────────────────────────────────
  ONE page is special: /programs/open-studies. Open Studies has no terms, so its
  by-code dataset is empty. On that URL — and only that URL — the script renders
  the course catalogue grouped by school/area from /data/open-studies-by-area.json,
  with Expand all / Collapse all and the course code linking to its Open Studies
  page when it has availability (the open-studies-courses.html layout).

  Every other program page is unaffected and keeps rendering its own requirements
  from the by-code dataset. The same two tags above serve both — there is nothing
  extra to add to the Open Studies page.

  The match is OS_PROGRAM_PATH in the script (/\/programs\/open-studies\/?$/i).
  Change it there if that URL ever moves.

  This supersedes the open-studies-courses.html embed on that page: once the two
  loader tags are on the template, DELETE that embed too, or the page renders the
  same accordion twice.

  Course links are site-relative (/open-studies/{slug}), so they follow whichever
  host serves the page. Only if Open Studies pages ever move to a different domain:
      <script>window.__PROGRAM_REQUIREMENTS_CONFIG__ = { coursePageOrigin: 'https://www.bowvalleycollege.ca' };</script>

  ── DATA ───────────────────────────────────────────────────────────────
  Generated by scripts/generateProgramRequirements.mjs (npm run
  generateProgramRequirements), which runs inside `npm run bvcapp-scripts`:
      /data/static/program-requirements-by-code/{CODE}.json
      /data/static/program-requirements-index.json
-->
