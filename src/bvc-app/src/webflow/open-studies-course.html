<!--
  WEBFLOW EMBED — Open Studies Course Detail
  ==========================================
  Paste this into a Webflow "Embed" block on the individual course detail page.

  The script resolves the course SIS ID from (in priority order):
    1. data-sisid attribute on the container div
    2. The last path segment of window.location.pathname
       e.g. /open-studies/ANAT1101  →  ANAT1101

  Configuration:
    data-base-url  — base URL of the bvc-app Vercel deployment (no trailing slash)
    data-sisid     — (optional) override SIS ID; useful in Webflow CMS via {{slug}}

  Example Webflow usage on a CMS collection page where slug = course SIS ID:
    <div
      id="bvc-os-course"
      data-base-url="https://bvc-uat.vercel.app"
      data-sisid="{{slug}}"
    ></div>
-->

<style>
  .bvc-oc-wrap * { box-sizing: border-box; }
  .bvc-oc-wrap { font-family: inherit; }

  /* Header */
  .bvc-oc-header { margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid #e2e8f0; }
  .bvc-oc-badges { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .bvc-oc-badge {
    display: inline-block;
    border-radius: 99px;
    padding: 3px 12px;
    font-size: 12px;
    font-weight: 500;
  }
  .bvc-oc-badge-blue { background: #e0edfb; color: #005596; }
  .bvc-oc-badge-gray { background: #f1f5f9; color: #475569; }
  .bvc-oc-title { font-size: 28px; font-weight: 700; color: #0f172a; margin: 0 0 12px; }
  .bvc-oc-desc { font-size: 15px; line-height: 1.65; color: #475569; max-width: 720px; margin: 0; }
  .bvc-oc-pdf-row { margin-top: 12px; }
  .bvc-oc-pdf-link {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: #dc2626; text-decoration: none;
  }
  .bvc-oc-pdf-link:hover { text-decoration: underline; color: #991b1b; }
  .bvc-oc-pdf-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  /* Section heading */
  .bvc-oc-section-heading {
    font-size: 18px; font-weight: 600; color: #0f172a;
    margin: 0 0 16px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .bvc-oc-section-count { font-size: 14px; font-weight: 400; color: #64748b; }

  /* Section card */
  .bvc-oc-card {
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    padding: 20px;
    margin-bottom: 14px;
    background: #fff;
  }
  .bvc-oc-card-header {
    display: flex; flex-wrap: wrap; justify-content: space-between;
    align-items: flex-start; gap: 10px; margin-bottom: 16px;
  }
  .bvc-oc-card-name { font-size: 16px; font-weight: 600; color: #0f172a; margin: 0; }
  .bvc-oc-card-sisid { font-size: 12px; color: #94a3b8; margin-top: 2px; }
  .bvc-oc-avail-yes { background: #dcfce7; color: #166534; border-radius: 99px; padding: 3px 12px; font-size: 12px; font-weight: 500; }
  .bvc-oc-avail-no  { background: #fee2e2; color: #991b1b; border-radius: 99px; padding: 3px 12px; font-size: 12px; font-weight: 500; }

  .bvc-oc-dl {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 12px 24px;
    margin-bottom: 16px;
    font-size: 13.5px;
  }
  .bvc-oc-dl dt { font-weight: 500; color: #64748b; margin-bottom: 2px; }
  .bvc-oc-dl dd { color: #1e293b; margin: 0; }

  .bvc-oc-schedule { margin-bottom: 16px; }
  .bvc-oc-schedule-label { font-size: 13px; font-weight: 500; color: #64748b; margin-bottom: 4px; }
  .bvc-oc-schedule-item { font-size: 13.5px; color: #1e293b; line-height: 1.8; }

  .bvc-oc-fees {
    display: flex; flex-wrap: wrap; gap: 10px;
    border-top: 1px solid #f1f5f9; padding-top: 14px;
  }
  .bvc-oc-fee-box { border-radius: 8px; padding: 8px 18px; text-align: center; }
  .bvc-oc-fee-box-dom { background: #eff6ff; }
  .bvc-oc-fee-box-intl { background: #f5f3ff; }
  .bvc-oc-fee-label { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
  .bvc-oc-fee-box-dom .bvc-oc-fee-label { color: #2563eb; }
  .bvc-oc-fee-box-intl .bvc-oc-fee-label { color: #7c3aed; }
  .bvc-oc-fee-amount { font-size: 20px; font-weight: 700; }
  .bvc-oc-fee-box-dom .bvc-oc-fee-amount { color: #1d4ed8; }
  .bvc-oc-fee-box-intl .bvc-oc-fee-amount { color: #6d28d9; }

  .bvc-oc-no-sections {
    padding: 24px; background: #f8fafc; border: 1px solid #e2e8f0;
    border-radius: 8px; text-align: center; color: #64748b; font-size: 14px;
  }
  .bvc-oc-loading, .bvc-oc-error {
    padding: 32px; text-align: center; color: #64748b; font-size: 14px;
  }
  .bvc-oc-error { color: #dc2626; }
</style>

<div id="bvc-os-course" data-base-url="https://bvc-uat.vercel.app"></div>

<script>
(function () {
  var container = document.getElementById('bvc-os-course');
  if (!container) return;

  var baseUrl = (container.getAttribute('data-base-url') || 'https://bvc-uat.vercel.app').replace(/\/$/, '');

  // Resolve course key: data-sisid attribute (Webflow CMS slug) → last URL path segment
  // The JSON is indexed by both sisId (ANAT1101) and slug (anatomy-and-physiology)
  var courseKey = container.getAttribute('data-sisid');
  if (!courseKey) {
    var parts = window.location.pathname.replace(/\/$/, '').split('/');
    courseKey = parts[parts.length - 1] || '';
  }
  courseKey = courseKey.trim();

  if (!courseKey) {
    container.innerHTML = '<div class="bvc-oc-error">Course ID not found in URL.</div>';
    return;
  }

  var jsonUrl = baseUrl + '/data/open-studies/' + encodeURIComponent(courseKey) + '.json';
  container.innerHTML = '<div class="bvc-oc-loading">Loading course…</div>';

  fetch(jsonUrl)
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (course) {
      var pdfHtml = '';
      if (course.pdfFilename) {
        var pdfUrl = baseUrl + '/data/course-outlines-pdf/' + encodeURIComponent(course.pdfFilename);
        pdfHtml = '<div class="bvc-oc-pdf-row">'
          + '<a class="bvc-oc-pdf-link" href="' + pdfUrl + '" target="_blank" rel="noopener">'
          + '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">'
          + '<path d="M5.625 1.5c-1.036 0-1.875.84-1.875 1.875v17.25c0 1.035.84 1.875 1.875 1.875h12.75c1.035 0 1.875-.84 1.875-1.875V12.75A3.75 3.75 0 0016.5 9h-1.875a1.875 1.875 0 01-1.875-1.875V5.25A3.75 3.75 0 009 1.5H5.625z"/>'
          + '<path d="M12.971 1.816A5.23 5.23 0 0114.25 5.25v1.875c0 .207.168.375.375.375H16.5a5.23 5.23 0 013.434 1.279 9.768 9.768 0 00-6.963-6.963z"/>'
          + '</svg>'
          + 'Course Outline PDF</a></div>';
      }

      var html = '<div class="bvc-oc-wrap">';

      // Header
      html += '<div class="bvc-oc-header">';
      html += '<div class="bvc-oc-badges">'
        + '<span class="bvc-oc-badge bvc-oc-badge-blue">' + esc(course.sisId) + '</span>'
        + (course.credits > 0
          ? '<span class="bvc-oc-badge bvc-oc-badge-gray">' + course.credits + ' ' + (course.credits === 1 ? 'credit' : 'credits') + '</span>'
          : '')
        + '</div>';
      html += '<h1 class="bvc-oc-title">' + esc(course.name) + '</h1>';
      if (course.description) {
        html += '<p class="bvc-oc-desc">' + esc(course.description) + '</p>';
      }
      html += pdfHtml;
      html += '</div>';

      // Sections
      html += '<h2 class="bvc-oc-section-heading">Available Sections '
        + '<span class="bvc-oc-section-count">(' + course.sections.length + ')</span></h2>';

      if (course.sections.length === 0) {
        html += '<div class="bvc-oc-no-sections">No sections are currently scheduled for this course.</div>';
      } else {
        course.sections.forEach(function (sec) {
          html += '<div class="bvc-oc-card">';

          // Card header
          html += '<div class="bvc-oc-card-header">';
          html += '<div><p class="bvc-oc-card-name">' + esc(sec.name) + '</p>'
            + '<p class="bvc-oc-card-sisid">SIS ID: ' + esc(sec.sisId) + '</p></div>';
          html += '<span class="' + (sec.seatsAvailable ? 'bvc-oc-avail-yes' : 'bvc-oc-avail-no') + '">'
            + (sec.seatsAvailable ? 'Seats Available' : 'Full') + '</span>';
          html += '</div>';

          // Details grid
          html += '<dl class="bvc-oc-dl">';
          html += dl('Delivery', sec.deliveryType);
          html += dl('Campus', sec.campus);
          html += dl('Hours', sec.hours > 0 ? sec.hours + ' hrs' : '—');
          html += dl('Start Date', sec.startDate || '—');
          html += dl('End Date', sec.endDate || '—');
          if (sec.registrationStart) {
            html += dl('Registration Opens', sec.registrationStart);
          }
          html += '</dl>';

          // Schedule
          if (sec.schedule && sec.schedule.length > 0) {
            html += '<div class="bvc-oc-schedule">';
            html += '<p class="bvc-oc-schedule-label">Schedule</p>';
            sec.schedule.forEach(function (s) {
              html += '<div class="bvc-oc-schedule-item">' + esc(s) + '</div>';
            });
            html += '</div>';
          }

          // Fees
          var domFee = sec.fees && sec.fees.domestic;
          var intlFee = sec.fees && sec.fees.international;
          if (domFee > 0 || intlFee > 0) {
            html += '<div class="bvc-oc-fees">';
            if (domFee > 0) {
              html += '<div class="bvc-oc-fee-box bvc-oc-fee-box-dom">'
                + '<div class="bvc-oc-fee-label">Domestic</div>'
                + '<div class="bvc-oc-fee-amount">' + fmtCad(domFee) + '</div>'
                + '</div>';
            }
            if (intlFee > 0) {
              html += '<div class="bvc-oc-fee-box bvc-oc-fee-box-intl">'
                + '<div class="bvc-oc-fee-label">International</div>'
                + '<div class="bvc-oc-fee-amount">' + fmtCad(intlFee) + '</div>'
                + '</div>';
            }
            html += '</div>';
          }

          html += '</div>'; // .bvc-oc-card
        });
      }

      html += '</div>'; // .bvc-oc-wrap
      container.innerHTML = html;
    })
    .catch(function (err) {
      container.innerHTML = '<div class="bvc-oc-error">Could not load course data. Please try again later.</div>';
      console.error('[bvc-os-course]', err);
    });

  function dl(label, value) {
    return '<div><dt>' + esc(label) + '</dt><dd>' + esc(String(value)) + '</dd></div>';
  }

  function fmtCad(n) {
    return new Intl.NumberFormat('en-CA', {
      style: 'currency', currency: 'CAD', minimumFractionDigits: 0
    }).format(n);
  }

  function esc(str) {
    return String(str || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }
})();
</script>
